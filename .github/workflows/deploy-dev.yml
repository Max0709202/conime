# dev（検証）環境への反映（本書 連携01）：main へのマージで db push・functions deploy
# 必要な Secrets：SUPABASE_ACCESS_TOKEN / SUPABASE_DEV_PROJECT_REF / SUPABASE_DEV_DB_PASSWORD（docs/setup.md 3.4）
name: Deploy to dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: プロジェクトへの接続
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: マイグレーションの適用
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions のデプロイ
        run: |
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy worker --project-ref "$PROJECT_REF" --no-verify-jwt
