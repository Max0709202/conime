# CI（本書 基盤02）：型チェック・pgTAP・Newman。マイグレーションと API の変更を自動検証する
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 型・静的解析・契約テスト（DB 不要）
      - name: Edge Functions の型チェック・lint
        run: |
          deno check supabase/functions/api/index.ts supabase/functions/worker/index.ts
          deno lint supabase/functions
      - name: 契約テスト・単体テスト
        run: deno test --allow-env --allow-read --allow-net supabase/functions

      - name: OpenAPI の検証
        run: npx -y @redocly/cli@1.25.15 lint openapi/openapi.yaml

      # DB（マイグレーション・RLS・制約）
      - name: Supabase の起動とマイグレーション・初期データの投入
        run: |
          supabase start
          supabase db reset
      - name: pgTAP（RLS 無効のテーブルがあれば失敗する）
        run: supabase test db

      # API（Postman コレクションを Newman で実行）
      - name: Edge Functions の起動
        run: |
          cp .env.example .env
          JWT=$(supabase status -o env | sed -n 's/^JWT_SECRET=\"\(.*\)\"$/\1/p')
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT}|" .env
          nohup supabase functions serve --env-file .env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:54321/functions/v1/api/v1/health -H "apikey: x" && break
            sleep 2
          done
      - name: Newman（正常系・主要なエラー系・OpenAPI との一致）
        run: |
          ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY=\"\(.*\)\"$/\1/p')
          npx -y newman@6.2.1 run postman/CONIME_Phase1.postman_collection.json \
            -e postman/local.postman_environment.json --env-var "anon_key=${ANON_KEY}"
      - name: Edge Functions のログ
        if: failure()
        run: cat functions.log || true
