extends:
  - recommended
rules:
  # Proprietary API; no public license.
  info-license: off
  # Tags are self-explanatory; descriptions live in docs/.
  tag-description: off
  # RealtimeEnvelope is published for realtime consumers (not an HTTP payload).
  no-unused-components: off
  # /v1/health and /v1/app-config are public and have no client-error case.
  operation-4xx-response: off
