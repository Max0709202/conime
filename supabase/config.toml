# Supabase CLI 設定（local 環境）。dev / prod の設定は Supabase ダッシュボードで行う。
# 設計書 連携01「supabase start 一つで DB・認証・API・初期データがそろう」
project_id = "conime-backend"

[api]
enabled = true
port = 54321
# アプリは PostgREST を使わない（設計書 基盤02 設計方針1）。public は Studio 確認用に公開するが、
# 書き込み関数は非公開の private スキーマに置くため PostgREST からは呼べない
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# トークルーム・DM の新着配信は第2段階
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["conime://auth-callback"]
# アクセストークン有効期限1時間（設計書 認証01）
jwt_expiry = 3600
# リフレッシュトークンは使い捨て・更新時に再発行
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# パスワード8文字以上
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# local / dev はメール確認を無効（本番での有効化は U-02）
enable_confirmations = false

# Sign in with Apple は要望があれば追加（U-02）
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# アプリ API。401 TOKEN_EXPIRED / UNAUTHENTICATED を区別して返すため JWT は関数内で検証する。
# GET /docs 用に openapi.yaml のコピーを同梱する（Edge Runtime は supabase/functions の外のファイルを同梱できない。
# 正は openapi/openapi.yaml。一致は api/contract_test.ts で検証）
[functions.api]
verify_jwt = false
static_files = ["./functions/api/openapi.yaml"]

# 生成ジョブの実行。WORKER_SECRET ヘッダーで保護（api と pg_cron から呼ばれる）
[functions.worker]
verify_jwt = false
