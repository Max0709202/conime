# Supabase CLI configuration (local stack via Docker: `supabase start`).
# Staging/production settings are configured in the Supabase dashboard / CLI; see docs/DEPLOYMENT.md.
project_id = "conime"

[api]
enabled = true
port = 54321
# The application schema "app" is intentionally NOT exposed through the Data API.
# Clients use the /v1 Edge Function only.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["conime://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Native sign-in from the iPhone app (signInWithIdToken). Credentials come from env.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# The API verifies JWTs itself (JWKS for asymmetric keys, or the legacy secret) and
# serves public endpoints (question set, app config, health).
[functions.api]
verify_jwt = false
import_map = "./functions/import_map.json"

# Protected by the WORKER_SECRET header; invoked by pg_cron/pg_net and the api function.
[functions.worker]
verify_jwt = false
import_map = "./functions/import_map.json"
