components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase の anon key（公開前提のキー。権限は RLS で制御）。全要求に付ける
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth のアクセストークン（有効期限1時間）。期限切れは 401 TOKEN_EXPIRED

  parameters:
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      description: 「1つの操作」ごとにアプリが生成する UUID。自動・手動の再試行では同じ値を使う。診断送信のキーは回答と一緒に端末保存し、再起動後の再送でも同じ値を使う
      schema: { type: string, format: uuid }
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      description: 作成系 POST の重複送信防止。ユーザー×キーで応答を24時間保存し、同じ内容の再送には初回と同じ応答を返す。同じキーで内容が異なる場合は 422 IDEMPOTENCY_KEY_REUSED
      schema: { type: string, format: uuid }
    MockScenario:
      in: header
      name: X-Mock-Scenario
      required: false
      description: |
        dev のみ（MOCK_MODE=true）。本番では無視する（API09）。
        generation_failed：診断送信後に status が failed / generation_slow：completed まで60秒 / empty：一覧・推薦が0件 /
        guild_full：409 GUILD_FULL / duplicate_goodto：409 DUPLICATE_GOODTO / token_expired：401 TOKEN_EXPIRED /
        rate_limited：429（Retry-After: 10） / server_error：500 / timeout：20秒無応答 / ai_unavailable：503（ナビゲーター）
      schema:
        type: string
        enum: [generation_failed, generation_slow, empty, guild_full, duplicate_goodto, token_expired, rate_limited, server_error, timeout, ai_unavailable]
    SubmissionId:
      in: path
      name: submission_id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: user_id
      required: true
      schema: { type: string, format: uuid }
    GuildId:
      in: path
      name: guild_id
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      in: path
      name: conversation_id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      in: query
      name: cursor
      description: 前回の応答の meta.next_cursor
      schema: { type: string }

  headers:
    RetryAfter:
      description: 再試行までの秒数
      schema: { type: integer }

  responses:
    ValidationError:
      description: 400 VALIDATION_ERROR（入力形式・上限違反。details に項目ごとの理由）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: answers[3].texts exceeds max_length
              details:
                - { field: 'answers[3].texts[0]', reason: max_length, limit: 100 }
              request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W1
    Unauthenticated:
      description: 401 UNAUTHENTICATED（トークンなし・不正）/ TOKEN_EXPIRED（期限切れ。リフレッシュ1回 → 失敗時は再ログイン）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: TOKEN_EXPIRED, message: access token has expired, details: [], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W2 }
    Forbidden:
      description: 403 FORBIDDEN（権限なし・未所属・ブロック中）/ ACCOUNT_WITHDRAWN（退会済み）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: ACCOUNT_WITHDRAWN, message: account has been withdrawn, details: [], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W3 }
    ConsentRequired:
      description: 403 CONSENT_REQUIRED（AI 送信同意が未取得・撤回済み・旧版）。同意画面を表示する
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: CONSENT_REQUIRED, message: valid ai_transfer consent is required, details: [{ doc_type: ai_transfer }], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W4 }
    NotFound:
      description: 404 NOT_FOUND（対象が存在しない。診断前のキャラ取得・他人のデータを含む）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: NOT_FOUND, message: character not found, details: [], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W5 }
    Conflict:
      description: |
        409 ALREADY_SUBMITTED（details に既存の submission_id）/ QUESTION_SET_OUTDATED / DUPLICATE_GOODTO（details に累計） /
        GUILD_FULL / GUILD_LIMIT_REACHED / ALREADY_MEMBER / GENERATION_IN_PROGRESS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: ALREADY_SUBMITTED, message: diagnosis has already been submitted, details: [{ submission_id: a3f7b2c1-0000-4000-8000-000000000301 }], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W6 }
    IdempotencyKeyReused:
      description: 422 IDEMPOTENCY_KEY_REUSED（同じ冪等キーで異なる内容。アプリの不具合として記録）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: IDEMPOTENCY_KEY_REUSED, message: Idempotency-Key was used with a different request, details: [], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W7 }
    RateLimited:
      description: 429 RATE_LIMITED（利用制限超過。Retry-After 秒後に再試行）
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: RATE_LIMITED, message: too many requests, details: [{ retry_after_seconds: 10 }], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W8 }
    AiUnavailable:
      description: 503 AI_UNAVAILABLE（生成 AI が一時的に利用不可。ナビゲーターは定型の代替メッセージ・N-2）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: AI_UNAVAILABLE, message: generative AI is temporarily unavailable, details: [], request_id: req_01JA8XK2M3N4P5Q6R7S8T9V0W9 }
    AuthError:
      description: Supabase Auth のエラー（形式は Supabase Auth の仕様。誤パスワードは 400 invalid_credentials、登録済みメールは 422 user_already_exists）
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer }
              error_code: { type: string }
              msg: { type: string }
          example: { code: 400, error_code: invalid_credentials, msg: Invalid login credentials }

  schemas:
    # ----------------------------------------------------------------- 共通
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - CONSENT_REQUIRED
        - FORBIDDEN
        - ACCOUNT_WITHDRAWN
        - NOT_FOUND
        - ALREADY_SUBMITTED
        - QUESTION_SET_OUTDATED
        - DUPLICATE_GOODTO
        - GUILD_FULL
        - GUILD_LIMIT_REACHED
        - ALREADY_MEMBER
        - GENERATION_IN_PROGRESS
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - AI_UNAVAILABLE
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 開発者向けの説明。画面文言には使わない }
            details:
              type: array
              items: { type: object }
            request_id: { type: string }
    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, 'null'], description: null なら末尾 }
    Compatibility:
      type: object
      required: [value, display]
      properties:
        value: { type: integer, minimum: 0, maximum: 100 }
        display: { type: string, example: 66% }
    MatchedItem:
      type: object
      required: [question_code, label, values]
      properties:
        question_code: { type: string }
        label: { type: string }
        values: { type: array, items: { type: string } }
    TagRef:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    CharacterThumb:
      type: object
      required: [name, level, thumbnail_url]
      properties:
        name: { type: [string, 'null'] }
        level: { type: integer, minimum: 1, maximum: 100 }
        thumbnail_url: { type: [string, 'null'] }

    # ----------------------------------------------------------------- 認証
    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, example: 3600 }
        expires_at: { type: integer }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }

    # ----------------------------------------------------------------- 質問・同意
    QuestionSetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [question_set, questions]
          properties:
            question_set:
              type: object
              required: [id, version, published_at]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                published_at: { type: string, format: date-time }
            questions:
              type: array
              items: { $ref: '#/components/schemas/Question' }
    Question:
      type: object
      required: [id, code, order, title, answer_type, required, constraints, usages, options]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: Q1, description: 版をまたいで同じ意味なら同じ code }
        order: { type: integer, minimum: 1, description: 出題順（問番号表示） }
        title: { type: string }
        answer_type: { type: string, enum: [single_choice, multi_choice, free_fields, free_multi] }
        required: { type: boolean }
        constraints:
          type: object
          properties:
            min_select: { type: integer }
            max_select: { type: integer }
            field_count: { type: integer }
            required_field_count: { type: integer }
            max_length: { type: integer }
        usages:
          type: array
          items: { type: string, enum: [character_base, character_adjust, match_score, profile_display] }
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }
    ConsentDocument:
      type: object
      required: [id, doc_type, version, title, body, requires_reconsent, published_at]
      properties:
        id: { type: string, format: uuid }
        doc_type: { type: string, enum: [terms, privacy, ai_transfer] }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string }
        requires_reconsent: { type: boolean, description: true の版では旧版への同意を無効とし再同意を求める }
        published_at: { type: string, format: date-time }
    ConsentRecordRequest:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [document_id, decision]
            properties:
              document_id: { type: string, format: uuid, description: GET /consent-documents/current の id（最新の有効版のみ） }
              decision: { type: string, enum: [granted, revoked] }
        app_version: { type: string, maxLength: 32 }
    ConsentStatusItem:
      type: object
      required: [doc_type, document_id, version, title, requires_reconsent, status, consent_id, decided_at]
      properties:
        doc_type: { type: string, enum: [terms, privacy, ai_transfer] }
        document_id: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        requires_reconsent: { type: boolean }
        status: { type: string, enum: [granted, revoked, not_decided, reconsent_required] }
        consent_id: { type: [string, 'null'], format: uuid }
        decided_at: { type: [string, 'null'], format: date-time }
    ConsentStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [all_granted, ai_transfer_granted, items]
          properties:
            all_granted: { type: boolean }
            ai_transfer_granted: { type: boolean }
            items:
              type: array
              items: { $ref: '#/components/schemas/ConsentStatusItem' }
    Me:
      type: object
      required: [user_id, email, display_name, role, status, consents, diagnosis, has_character, next_action]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, withdrawn] }
        consents:
          type: object
          required: [all_granted, ai_transfer_granted]
          properties:
            all_granted: { type: boolean }
            ai_transfer_granted: { type: boolean }
        diagnosis:
          type: object
          required: [status, submission_id]
          properties:
            status: { type: string, enum: [not_submitted, received, processing, completed, failed] }
            submission_id: { type: [string, 'null'], format: uuid }
        has_character: { type: boolean }
        next_action:
          type: string
          enum: [consent_required, diagnosis_required, generating, retry_required, ready]
          description: |
            consent_required：同意画面へ / diagnosis_required：端末保存の回答を送信（または診断へ） /
            generating：生成待ち画面へ / retry_required：再試行ボタンを表示 / ready：スクエアへ

    # ----------------------------------------------------------------- 診断
    DiagnosisSubmitRequest:
      type: object
      required: [question_set_id, question_set_version, answers]
      properties:
        question_set_id: { type: string, format: uuid }
        question_set_version: { type: integer, minimum: 1 }
        answered_at: { type: string, format: date-time }
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Answer' }
    Answer:
      type: object
      required: [question_code]
      properties:
        question_code: { type: string, example: Q9 }
        option_codes: { type: array, items: { type: string }, description: 選択式（single_choice / multi_choice） }
        texts: { type: array, items: { type: string }, description: 自由記述（free_fields / free_multi） }
    DiagnosisStatusValue:
      type: string
      enum: [received, processing, completed, failed]
    DiagnosisAccepted:
      type: object
      required: [submission_id, status, submitted_at, poll_after_seconds]
      properties:
        submission_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DiagnosisStatusValue' }
        submitted_at: { type: string, format: date-time }
        poll_after_seconds: { type: integer, example: 3 }
    DiagnosisStatus:
      type: object
      required: [submission_id, status, submitted_at, completed_at, error_code, poll_after_seconds, retryable]
      properties:
        submission_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DiagnosisStatusValue' }
        submitted_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        error_code:
          type: [string, 'null']
          description: failed の理由（GENERATION_FAILED / GENERATION_TIMEOUT）
        poll_after_seconds: { type: [integer, 'null'], description: received / processing のときの再取得間隔 }
        retryable: { type: boolean, description: 'true なら POST /diagnoses/{submission_id}/retry で再試行できる' }
    PartStatus:
      type: string
      enum: [pending, ready, failed]
    DiagnosisResult:
      type: object
      required: [submission, profile, character, image, recommendations]
      properties:
        submission:
          type: object
          required: [submission_id, status]
          properties:
            submission_id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/DiagnosisStatusValue' }
        profile:
          type: object
          required: [status, personality, items, ai_comments]
          properties:
            status: { $ref: '#/components/schemas/PartStatus' }
            personality: { type: [string, 'null'] }
            items:
              type: array
              items:
                type: object
                required: [key, label, values]
                properties:
                  key: { type: string }
                  label: { type: string }
                  values: { type: array, items: { type: string } }
            ai_comments: { type: array, items: { type: string } }
        character:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CharacterSummary'
        image: { $ref: '#/components/schemas/CharacterImage' }
        recommendations:
          type: object
          required: [status, works, guilds, users]
          properties:
            status: { type: string, enum: [pending, ready] }
            works: { type: array, items: { $ref: '#/components/schemas/WorkRecommendation' } }
            guilds: { type: array, items: { $ref: '#/components/schemas/GuildRecommendation' } }
            users: { type: array, items: { $ref: '#/components/schemas/UserRecommendation' } }

    # ----------------------------------------------------------------- キャラクター
    Skill:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    CharacterSummary:
      type: object
      required: [public_code, name, level, species, class, attribute, rarity, title, personality, strengths, weaknesses, skills, extra]
      properties:
        public_code: { type: string, pattern: '^C-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$', description: 画面表示用キャラID（U-07） }
        name: { type: [string, 'null'], description: 初回は null }
        level: { type: integer, minimum: 1, maximum: 100 }
        species: { type: [string, 'null'] }
        class: { type: [string, 'null'] }
        attribute: { type: [string, 'null'] }
        rarity: { type: [string, 'null'] }
        title: { type: [string, 'null'], description: 称号（Q-7） }
        personality: { type: [string, 'null'] }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        extra: { type: object, description: 表示項目の追加用。未知のキーは無視する }
    CharacterImage:
      type: object
      required: [status, url, expires_at, stage]
      properties:
        status: { type: string, enum: [none, generating, ready, failed] }
        url: { type: [string, 'null'], description: 署名付き URL（1時間） }
        expires_at: { type: [string, 'null'], format: date-time }
        stage: { type: integer, minimum: 0, description: 現在画像の進化段階（0 = 初期、5 = Lv.5 …） }
    Character:
      type: object
      required: [public_code, name, species, class, attribute, rarity, title, level, max_level, exp_total, goodto_points, personality, strengths, weaknesses, skills, status_items, image, created_at]
      properties:
        public_code: { type: string, pattern: '^C-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$' }
        name: { type: [string, 'null'] }
        species: { type: [string, 'null'] }
        class: { type: [string, 'null'] }
        attribute: { type: [string, 'null'] }
        rarity: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        level: { type: integer, minimum: 1, maximum: 100 }
        max_level: { type: integer }
        exp_total: { type: integer, minimum: 0 }
        goodto_points: { type: integer, minimum: 0 }
        personality: { type: [string, 'null'] }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        status_items: { type: object, description: 性格・得意・苦手・スキル・ステータス等。項目は増減する（Q-3） }
        image: { $ref: '#/components/schemas/CharacterImage' }
        created_at: { type: string, format: date-time }

    # ----------------------------------------------------------------- ユーザー・推薦
    PublicUser:
      type: object
      required: [id, display_name, character, profile_items, can_start_dm]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, 'null'] }
        character:
          type: [object, 'null']
          required: [public_code, name, level, thumbnail_url]
          properties:
            public_code: { type: string }
            name: { type: [string, 'null'] }
            level: { type: integer }
            species: { type: [string, 'null'] }
            class: { type: [string, 'null'] }
            attribute: { type: [string, 'null'] }
            rarity: { type: [string, 'null'] }
            title: { type: [string, 'null'] }
            thumbnail_url: { type: [string, 'null'] }
        profile_items:
          type: array
          items:
            type: object
            required: [key, label, values]
            properties:
              key: { type: string }
              label: { type: string }
              values: { type: array, items: { type: string } }
        can_start_dm: { type: boolean }
    UserRecommendation:
      type: object
      required: [rank, user, compatibility, matched_items, can_start_dm]
      properties:
        rank: { type: integer, minimum: 1 }
        user:
          type: object
          required: [id, display_name, character]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, 'null'] }
            character: { $ref: '#/components/schemas/CharacterThumb' }
        compatibility: { $ref: '#/components/schemas/Compatibility' }
        matched_items: { type: array, items: { $ref: '#/components/schemas/MatchedItem' } }
        can_start_dm: { type: boolean }
    GuildRecommendation:
      type: object
      required: [rank, guild, compatibility, matched_items, reason]
      properties:
        rank: { type: integer, minimum: 1 }
        guild:
          type: object
          required: [id, name, member_count, capacity, tags]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            member_count: { type: integer }
            capacity: { type: integer }
            tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        compatibility: { $ref: '#/components/schemas/Compatibility' }
        matched_items: { type: array, items: { $ref: '#/components/schemas/MatchedItem' } }
        reason: { type: [string, 'null'] }
    WorkRecommendation:
      type: object
      required: [rank, work, matched_items, reason]
      properties:
        rank: { type: integer, minimum: 1 }
        work:
          type: object
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        matched_items: { type: array, items: { $ref: '#/components/schemas/MatchedItem' } }
        reason: { type: [string, 'null'], description: AI による推薦理由 }

    # ----------------------------------------------------------------- ギルド
    GuildSummary:
      type: object
      required: [id, name, description, tags, member_count, capacity, is_member, is_full]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        member_count: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 1 }
        is_member: { type: boolean }
        is_full: { type: boolean }
    GuildListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/GuildSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    GuildDetail:
      allOf:
        - $ref: '#/components/schemas/GuildSummary'
        - type: object
          required: [leader_info, conversation_id, my_role, joined_at]
          properties:
            leader_info: { type: [string, 'null'] }
            conversation_id: { type: string, format: uuid, description: トークルームの会話ID }
            my_role: { type: [string, 'null'], enum: [member, leader, staff, null] }
            joined_at: { type: [string, 'null'], format: date-time }
    GuildJoinResult:
      type: object
      required: [guild_id, conversation_id, member_count, capacity]
      properties:
        guild_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        member_count: { type: integer }
        capacity: { type: integer }
    Announcement:
      type: object
      required: [id, title, body, published_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        published_at: { type: string, format: date-time }
    GuildMember:
      type: object
      required: [user_id, display_name, role, character, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, 'null'] }
        role: { type: string, enum: [member, leader, staff], description: 発言者情報（C-2）に表示 }
        character: { $ref: '#/components/schemas/CharacterThumb' }
        joined_at: { type: string, format: date-time }

    # ----------------------------------------------------------------- 会話
    DmThread:
      type: object
      required: [conversation_id, partner, last_message, has_unread, unread_count]
      properties:
        conversation_id: { type: string, format: uuid }
        partner:
          type: object
          required: [user_id, display_name, character]
          properties:
            user_id: { type: string, format: uuid }
            display_name: { type: [string, 'null'] }
            character: { $ref: '#/components/schemas/CharacterThumb' }
        last_message:
          type: [object, 'null']
          required: [body, created_at]
          properties:
            body: { type: [string, 'null'] }
            created_at: { type: string, format: date-time }
        has_unread: { type: boolean }
        unread_count: { type: integer, minimum: 0 }
    Message:
      type: object
      required: [id, conversation_id, sender, body, image_url, created_at, goodto]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender:
          type: object
          required: [type, user_id, display_name, role, character_thumbnail_url]
          properties:
            type: { type: string, enum: [user, navigator, system] }
            user_id: { type: [string, 'null'], format: uuid, description: 退会したユーザーは null }
            display_name: { type: string, description: 退会したユーザーは「退会したユーザー」 }
            role: { type: [string, 'null'], enum: [member, leader, staff, null] }
            character_thumbnail_url: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        goodto:
          type: object
          required: [total_count, granted_by_me]
          properties:
            total_count: { type: integer, minimum: 0 }
            granted_by_me: { type: boolean }

    # ----------------------------------------------------------------- グッと・成長
    GoodtoResult:
      type: object
      required: [target, total_count, granted]
      properties:
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [message] }
            id: { type: string, format: uuid }
        total_count: { type: integer, minimum: 0, description: 対象の累計グッと数 }
        granted: { type: boolean }
    ReceivedGoodto:
      type: object
      required: [id, giver, target, points, created_at]
      properties:
        id: { type: string, format: uuid }
        giver:
          type: object
          required: [user_id, display_name]
          properties:
            user_id: { type: [string, 'null'], format: uuid }
            display_name: { type: [string, 'null'] }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [message] }
            id: { type: string, format: uuid }
        points: { type: integer }
        created_at: { type: string, format: date-time }
    Growth:
      type: object
      required: [level, max_level, exp_total, exp_current_level_start, exp_next_level, goodto_points, next_evolution_level, image]
      properties:
        level: { type: integer, minimum: 1, maximum: 100 }
        max_level: { type: integer }
        exp_total: { type: integer, minimum: 0 }
        exp_current_level_start: { type: integer, minimum: 0 }
        exp_next_level: { type: [integer, 'null'], description: レベル上限では null }
        goodto_points: { type: integer, minimum: 0 }
        next_evolution_level: { type: [integer, 'null'], description: 次に画像が更新されるレベル（5の倍数） }
        image: { $ref: '#/components/schemas/CharacterImage' }

    # ----------------------------------------------------------------- ナビゲーター・通知・安心安全
    NavigatorMessage:
      type: object
      required: [id, role, body, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, navigator] }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, title, body, link, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [goodto_received, level_up, guild_announcement, dm_received, system] }
        title: { type: string }
        body: { type: [string, 'null'] }
        link: { type: [string, 'null'], description: アプリ内の遷移先 }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    BlockedUser:
      type: object
      required: [user_id, display_name, created_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
