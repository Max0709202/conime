openapi: 3.1.0
info:
  title: CONIME App API
  version: 1.0.0
  summary: CONIME MVP（iPhone アプリ / Unity）向けアプリ API
  description: |
    CONIME MVP サーバーサイド設計書（CONIME-BE-SPEC-001 v1.0）第3章の API 仕様の正式な定義。

    - アプリ API は 39 本（実動作 13 本・モック 26 本）。このほか Supabase Auth の認証 API 4 本（タグ `Auth`）を参考として記載する。
    - `x-conime-stage: live` は第1段階で本実装（実動作）、`x-conime-stage: mock` は同じ契約のモック応答（第2段階で中身だけを差し替え）。
    - 項目名は snake_case、日時は ISO 8601（UTC）、ID は UUID（キャラIDのみ public_code）。
    - 成功時は `data`（一覧は `meta` にページング情報）、失敗時は `error` を返す。アプリは HTTP ステータスではなく `error.code` で分岐する（API02）。
    - 項目の追加は後方互換として扱う。アプリは未知の項目を無視する。
    - dev 環境では `X-Mock-Scenario` ヘッダーで異常系を再現できる（API09・本番では無視）。
  contact:
    name: CONIME バックエンド担当
  license:
    name: Proprietary（貴社に帰属）
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/api/v1
    description: dev（検証）環境
    variables:
      projectRef:
        default: your-project-ref
        description: Supabase プロジェクトの Reference ID
  - url: http://127.0.0.1:54321/functions/v1/api/v1
    description: local（supabase start + supabase functions serve）
  - url: http://127.0.0.1:4010
    description: Prism ローカルモック（npx @stoplight/prism-cli mock openapi/openapi.yaml）
security:
  - apiKey: []
    bearerAuth: []
tags:
  - name: Auth
    description: Supabase Auth（ベース URL は `/auth/v1`。応答・エラー形式は Supabase Auth の仕様に従う）
  - name: System
    description: 活死確認
  - name: Questions
    description: 質問定義（Q-1・Q-6）
  - name: Consent
    description: アカウント・同意（AC-1・AC-2）
  - name: Diagnosis
    description: 診断送信・生成状態・結果（Q-2・Q-3）
  - name: Character
    description: マイキャラ（Q-4・Q-7・L-3）
  - name: Users
    description: 他ユーザー・推薦（M-1〜M-4・Q-5）
  - name: Guilds
    description: ギルド（G-1〜G-5）
  - name: Conversations
    description: トークルーム・DM（C-1〜C-5）
  - name: Growth
    description: グッと・成長（C-3・L-1〜L-5）
  - name: Navigator
    description: ナビゲーター（N-1・N-2）
  - name: Notifications
    description: 通知（NT-1）
  - name: Safety
    description: 安心安全・退会（S-1・S-2・AC-3）

paths:
  # ===================================================================== Auth（Supabase Auth）
  /auth/v1/signup:
    servers:
      - url: https://{projectRef}.supabase.co
        variables:
          projectRef:
            default: your-project-ref
      - url: http://127.0.0.1:54321
    post:
      tags: [Auth]
      operationId: authSignup
      summary: サインアップ（Supabase Auth）
      description: メールアドレス＋パスワード（8文字以上）。dev ではメール確認が無効のため、応答にトークンが含まれる（U-02）。
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                data:
                  type: object
                  description: ユーザーメタデータ。display_name は profiles に反映される
                  properties:
                    display_name: { type: string, maxLength: 30 }
            example:
              email: user@example.com
              password: conime-pass-2026
              data: { display_name: ゆうき }
      responses:
        '200':
          description: 登録成功（メール確認無効時はセッションを返す）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/AuthError' }
  /auth/v1/token:
    servers:
      - url: https://{projectRef}.supabase.co
        variables:
          projectRef:
            default: your-project-ref
      - url: http://127.0.0.1:54321
    post:
      tags: [Auth]
      operationId: authToken
      summary: ログイン（grant_type=password）・トークン更新（grant_type=refresh_token）
      description: |
        リフレッシュトークンは使い捨てで、更新のたびに再発行される。iOS キーチェーンに保存し、アクセストークンはメモリのみで保持する（連携03）。
      security:
        - apiKey: []
      parameters:
        - in: query
          name: grant_type
          required: true
          schema: { type: string, enum: [password, refresh_token] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: password
                  required: [email, password]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string }
                - type: object
                  title: refresh_token
                  required: [refresh_token]
                  properties:
                    refresh_token: { type: string }
            example:
              email: user@example.com
              password: conime-pass-2026
      responses:
        '200':
          description: トークン発行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/AuthError' }
  /auth/v1/logout:
    servers:
      - url: https://{projectRef}.supabase.co
        variables:
          projectRef:
            default: your-project-ref
      - url: http://127.0.0.1:54321
    post:
      tags: [Auth]
      operationId: authLogout
      summary: ログアウト（リフレッシュトークンを失効）
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [global, local, others], default: global }
          description: local はこの端末のセッションのみ、global は全端末のセッションを失効する
      responses:
        '204': { description: ログアウト完了 }
        '401': { $ref: '#/components/responses/AuthError' }

  # ===================================================================== 実動作（13本）
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 活死確認
      x-conime-stage: live
      x-requirements: []
      security:
        - apiKey: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, api_version, mock_mode, time]
                    properties:
                      status: { type: string, enum: [ok] }
                      api_version: { type: string }
                      mock_mode: { type: boolean }
                      time: { type: string, format: date-time }
              example:
                data: { status: ok, api_version: 1.0.0, mock_mode: true, time: '2026-10-20T03:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /question-sets/current:
    get:
      tags: [Questions]
      operationId: getCurrentQuestionSet
      summary: 公開中の質問定義を取得
      description: |
        質問・選択肢・回答形式・上限・用途はサーバーが管理し、アプリは取得した定義どおりに出題する（Q-1・Q-6）。
        アプリは question_set.id と version を回答と一緒に端末保存し、送信時に添える。
        ETag / If-None-Match に対応し、変更がなければ 304 を返す。
      x-conime-stage: live
      x-requirements: [Q-1, Q-6]
      security:
        - apiKey: []
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
          description: 前回の応答の ETag
      responses:
        '200':
          description: 公開中の質問セット
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSetResponse' }
              example:
                data:
                  question_set: { id: 0b9d6c1e-5a4f-4c47-9d0a-000000000001, version: 1, published_at: '2026-10-20T00:00:00Z' }
                  questions:
                    - id: 5c21a8f0-0000-4000-8000-000000000001
                      code: Q1
                      order: 1
                      title: 好きなアニメ（マンガ含む）3作品
                      answer_type: free_fields
                      required: true
                      constraints: { field_count: 3, required_field_count: 3, max_length: 50 }
                      usages: [match_score, profile_display]
                      options: []
                    - id: 8e04a8f0-0000-4000-8000-000000000009
                      code: Q9
                      order: 9
                      title: 好きな楽しみ方
                      answer_type: multi_choice
                      required: true
                      constraints: { min_select: 1, max_select: 3 }
                      usages: [match_score, profile_display]
                      options:
                        - { code: A, label: 視聴・読書 }
                        - { code: B, label: グッズ }
        '304': { description: 変更なし（If-None-Match が ETag と一致） }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consent-documents/current:
    get:
      tags: [Consent]
      operationId: getCurrentConsentDocuments
      summary: 最新の同意文書を取得
      description: terms（利用規約）・privacy（プライバシーポリシー）・ai_transfer（外部 AI 送信、AC-2）の最新の有効版。文言は貴社支給（U-03・U-21）。
      x-conime-stage: live
      x-requirements: [AC-2]
      security:
        - apiKey: []
      responses:
        '200':
          description: 最新の有効版の一覧
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConsentDocument' }
              example:
                data:
                  - id: c0a5e0d0-0000-4000-8000-000000000001
                    doc_type: terms
                    version: 1
                    title: CONIME 利用規約（検証用の仮文書）
                    body: 本文は貴社支給の利用規約で差し替えます（U-21）。
                    requires_reconsent: false
                    published_at: '2026-10-20T00:00:00Z'
                  - id: c0a5e0d0-0000-4000-8000-000000000003
                    doc_type: ai_transfer
                    version: 1
                    title: 外部 AI サービスへの情報送信について（検証用の仮文書）
                    body: 送信先・送信する情報・目的を記載します。
                    requires_reconsent: true
                    published_at: '2026-10-20T00:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me:
    get:
      tags: [Consent]
      operationId: getMe
      summary: 自分の状態（プロフィール・同意・診断状況）
      description: SC-01 トップで遷移先を決めるために使う。next_action に従って画面を切り替える。
      x-conime-stage: live
      x-requirements: [AC-1]
      responses:
        '200':
          description: 自分の状態
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Me' }
              example:
                data:
                  user_id: d0000000-0000-4000-8000-000000000002
                  email: diagnosed@conime.test
                  display_name: 診断済みユーザー
                  role: user
                  status: active
                  consents: { all_granted: true, ai_transfer_granted: true }
                  diagnosis: { status: completed, submission_id: e0000000-0000-4000-8000-000000000002 }
                  has_character: true
                  next_action: ready
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/consents:
    get:
      tags: [Consent]
      operationId: getMyConsents
      summary: 自分の同意状況
      x-conime-stage: live
      x-requirements: [AC-2]
      responses:
        '200':
          description: 最新の有効版ごとの同意状況
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse' }
              example:
                data:
                  all_granted: true
                  ai_transfer_granted: true
                  items:
                    - doc_type: ai_transfer
                      document_id: c0a5e0d0-0000-4000-8000-000000000003
                      version: 1
                      title: 外部 AI サービスへの情報送信について（検証用の仮文書）
                      requires_reconsent: true
                      status: granted
                      consent_id: 2ec205a9-8d3f-4bb2-9e55-fa58b51a783f
                      decided_at: '2026-10-20T03:05:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Consent]
      operationId: recordConsents
      summary: 同意・撤回を記録
      description: |
        最新の有効版の文書に対して granted（同意）または revoked（撤回）を記録する。履歴は追記のみ。
        ai_transfer を revoked にすると、以降の AI 送信（POST /diagnoses・retry・ナビゲーター）は 403 CONSENT_REQUIRED になる（送信済みデータの扱いは U-03）。
      x-conime-stage: live
      x-requirements: [AC-2]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRecordRequest' }
            example:
              consents:
                - { document_id: c0a5e0d0-0000-4000-8000-000000000001, decision: granted }
                - { document_id: c0a5e0d0-0000-4000-8000-000000000002, decision: granted }
                - { document_id: c0a5e0d0-0000-4000-8000-000000000003, decision: granted }
              app_version: 1.0.0
      responses:
        '201':
          description: 記録後の同意状況
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }

  /diagnoses:
    post:
      tags: [Diagnosis]
      operationId: submitDiagnosis
      summary: 診断回答を一括送信する（登録・AI送信同意の後）
      description: |
        登録と AI 送信同意の完了後に、端末に保存した回答を一括で送信する（API07）。1ユーザー1回。
        同じ Idempotency-Key の再送には初回と同じ 202 応答（同じ submission_id）を返す。
        成功時は同じトランザクションで「送信・回答・生成ジョブ」を登録し、生成は worker が非同期で行う。

        | 検証項目 | ルール | 違反時 |
        |---|---|---|
        | 同意 | ai_transfer の有効な同意がある | 403 CONSENT_REQUIRED |
        | 送信回数 | そのユーザーの送信が未登録 | 409 ALREADY_SUBMITTED（details に既存の submission_id） |
        | 質問セットの版 | published、または deprecated（版上げ後30日の猶予期間・U-22）のみ受付 | 409 QUESTION_SET_OUTDATED |
        | 回答の網羅 | 必須質問はすべて含む。未知の code・同じ code の重複は不可 | 400 VALIDATION_ERROR |
        | single_choice | option_codes がちょうど1つで定義済みの code | 400 VALIDATION_ERROR |
        | multi_choice | min_select〜max_select 個、重複なし | 400 VALIDATION_ERROR |
        | free_fields | texts の要素数 = field_count。必須欄（先頭から required_field_count 個）は空白のみ不可。各 max_length 以内 | 400 VALIDATION_ERROR |
        | free_multi | texts は1要素・max_length 以内（区切りの解析はサーバー） | 400 VALIDATION_ERROR |

        文字数は Unicode のコードポイント数で数える。
      x-conime-stage: live
      x-requirements: [Q-2, Q-3, Q-6, AC-2]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/MockScenario'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisSubmitRequest' }
            example:
              question_set_id: 0b9d6c1e-5a4f-4c47-9d0a-000000000001
              question_set_version: 1
              answers:
                - { question_code: Q1, texts: [作品A, 作品B, 作品C] }
                - { question_code: Q6, option_codes: [B] }
                - { question_code: Q7, texts: [作品D、作品E] }
                - { question_code: Q9, option_codes: [A, C, D] }
              answered_at: '2026-10-20T03:10:00Z'
      responses:
        '202':
          description: 受付済み
          headers:
            Location:
              description: 状態取得 URL（GET /diagnoses/{submission_id}）
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DiagnosisAccepted' }
              example:
                data:
                  submission_id: a3f7b2c1-0000-4000-8000-000000000301
                  status: received
                  submitted_at: '2026-10-20T03:10:02Z'
                  poll_after_seconds: 3
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }

  /diagnoses/{submission_id}:
    get:
      tags: [Diagnosis]
      operationId: getDiagnosisStatus
      summary: 生成状態を取得
      description: |
        状態だけを返し、何度呼んでも生成を重複させない（設計04）。poll_after_seconds ごとに呼ぶ。
        completed になったら GET /me/diagnosis-result で結果を取得する。failed は回答を保持しており、POST /diagnoses/{id}/retry で再試行できる。
        生成の待機上限は未定のため（U-08）、サーバー側タイムアウト3分で failed（error_code = GENERATION_TIMEOUT）とする。
        他人の submission_id は 404 を返す。
      x-conime-stage: live
      x-requirements: [Q-3]
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: 生成状態
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DiagnosisStatus' }
              example:
                data:
                  submission_id: a3f7b2c1-0000-4000-8000-000000000301
                  status: processing
                  submitted_at: '2026-10-20T03:10:02Z'
                  completed_at: null
                  error_code: null
                  poll_after_seconds: 3
                  retryable: false
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /diagnoses/{submission_id}/retry:
    post:
      tags: [Diagnosis]
      operationId: retryDiagnosis
      summary: 生成失敗時の再試行
      description: |
        status が failed のときだけ新しい生成ジョブを登録し、received に戻す。回答は再送不要。
        生成中（received / processing）は 409 GENERATION_IN_PROGRESS（アプリは状態取得を継続）。completed の場合は何もせず現在の状態を返す。
      x-conime-stage: live
      x-requirements: [Q-3, AC-2]
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/MockScenario'
      responses:
        '202':
          description: 再試行を受付
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DiagnosisStatus' }
              example:
                data:
                  submission_id: a3f7b2c1-0000-4000-8000-000000000301
                  status: received
                  submitted_at: '2026-10-20T03:10:02Z'
                  completed_at: null
                  error_code: null
                  poll_after_seconds: 3
                  retryable: false
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/diagnosis-result:
    get:
      tags: [Diagnosis]
      operationId: getMyDiagnosisResult
      summary: プロフィール・キャラ・画像・推薦を一括取得
      description: |
        結果画面（SC-03・SC-04）に必要な情報を1回で取得する。部分完了に備え各部分に status を持つ（U-08）。
        character.name は初回 null。命名後に PATCH /me/character で登録する（Q-3・Q-4）。extra は表示項目の追加用で、未知のキーは無視する。
        画像 URL は署名付き（1時間）。推薦は第2段階（P2-3）で生成するため、第1段階は status = pending で空配列を返す。
        診断を送信していない場合は 404。
      x-conime-stage: live
      x-requirements: [Q-3, Q-5]
      responses:
        '200':
          description: 診断結果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DiagnosisResult' }
              example:
                data:
                  submission: { submission_id: e0000000-0000-4000-8000-000000000002, status: completed }
                  profile:
                    status: ready
                    personality: 落ち着いていて、仲間思いの守り手タイプ。
                    items:
                      - { key: favorite_works, label: 好きな作品, values: [作品A, 作品B, 作品C] }
                    ai_comments: [仲間との絆を大切にするあなたにぴったりのキャラクターが誕生しました。]
